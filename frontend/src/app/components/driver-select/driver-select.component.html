<h3>1. Chaufför</h3>
<app-name-autocomplete
  inputId="driverName"
  label="Sök eller skriv namn:"
  placeholder="T.ex. Tony Blaffert"
  [options]="driverNames"
  [value]="driverName"
  (valueChange)="onNameInput($event)"
></app-name-autocomplete>

<div class="field-row">
  <label for="adrExpiry">ADR Giltigt till:</label>
  <input
    id="adrExpiry"
    type="date"
    [ngModel]="adrExpiry"
    (ngModelChange)="onAdrExpiryInput($event)"
  />
</div>

<div *ngIf="isNewDriver" class="badge warning">Ny Chaufför (Manuell inmatning)</div>
