<div class="modal-backdrop" *ngIf="isOpen" (click)="onClose()">
  <div class="modal-panel" (click)="$event.stopPropagation()" *ngIf="model as m">
    <header class="modal-header">
      <h3>Redigera checklista</h3>
      <button type="button" class="btn-icon" (click)="onClose()" aria-label="Stäng">✕</button>
    </header>

    <div class="modal-body">
      <section class="form-section">
        <h4>Chaufför</h4>
        <div class="form-grid">
          <label>
            Namn
            <input type="text" [(ngModel)]="m.driverName" />
          </label>
          <label>
            ADR giltigt till
            <input type="date" [(ngModel)]="m.driverAdrExpiry" />
          </label>
        </div>
        <label class="checkbox-row">
          <input type="checkbox" [(ngModel)]="m.isNewDriver" />
          Ny Chaufför
        </label>
        <label>
          Lastningsassistans
          <select [(ngModel)]="m.assistType">
            <option *ngFor="let a of assistTypeOptions" [ngValue]="a">{{ assistTypeLabel(a) }}</option>
          </select>
        </label>
      </section>

      <section class="form-section">
        <h4>Åkeri & Operatör</h4>
        <div class="form-grid">
          <label>
            Åkeri
            <input type="text" [(ngModel)]="m.akeri" />
          </label>
          <label>
            Operatör / Vakt
            <input type="text" [(ngModel)]="m.operatorName" list="operatorListEdit" />
            <datalist id="operatorListEdit">
              <option *ngFor="let o of operators" [value]="o"></option>
            </datalist>
          </label>
        </div>
      </section>

      <section class="form-section">
        <h4>Dragbil</h4>
        <div class="form-grid">
          <label>
            Reg.nr
            <input type="text" [(ngModel)]="m.truck.regNr" />
          </label>
        </div>
        <label class="checkbox-row">
          <input type="checkbox" [(ngModel)]="m.truck.isNew" />
          Ny Dragbil
        </label>
      </section>

      <section class="form-section" *ngIf="m.trailers.length > 0">
        <h4>Släpvagnar</h4>
        <div class="form-grid" *ngFor="let trailer of m.trailers; let i = index">
          <label>
            Släp {{ i + 1 }} Reg.nr
            <input type="text" [(ngModel)]="trailer.regNr" />
          </label>
          <label class="checkbox-row">
            <input type="checkbox" [(ngModel)]="trailer.isNew" />
            Nytt Släp {{ i + 1 }}
          </label>
        </div>
      </section>

      <section class="form-section" *ngIf="m.tankSlots.length > 0">
        <h4>Tankplatser</h4>
        <table class="edit-table">
          <thead>
            <tr>
              <th>Tank</th>
              <th>Tankkod</th>
              <th>Typ</th>
              <th>Senaste (åååå-mm)</th>
              <th>Giltig t.o.m (åååå-mm)</th>
              <th>Utgången</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let slot of m.tankSlots; let i = index">
              <td>Tank {{ i + 1 }}</td>
              <td><input type="text" [(ngModel)]="slot.tankCode" /></td>
              <td>
                <select [(ngModel)]="slot.inspectionType">
                  <option value="L">L</option>
                  <option value="P">P</option>
                </select>
              </td>
              <td><input type="text" [(ngModel)]="slot.lastInspectionMonthYear" placeholder="2025-06" /></td>
              <td><input type="text" [(ngModel)]="slot.expiryFormatted" placeholder="2028-06" /></td>
              <td><input type="checkbox" [(ngModel)]="slot.isExpired" /></td>
            </tr>
          </tbody>
        </table>
      </section>

      <section class="form-section">
        <h4>Produkter (ändras i steg 3)</h4>
        <ul class="readonly-list">
          <li *ngFor="let p of m.selectedProducts">{{ p.name }} ({{ p.unNumber }})</li>
        </ul>
      </section>
    </div>

    <footer class="modal-footer">
      <button type="button" class="btn secondary" (click)="onClose()">Avbryt</button>
      <button type="button" class="btn primary" [disabled]="isSaving" (click)="onSave()">
        {{ isSaving ? 'Sparar...' : 'Spara & uppdatera' }}
      </button>
    </footer>
  </div>
</div>
